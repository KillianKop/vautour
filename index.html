<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14181f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vautour" />
    <meta name="description" content="Paragliding cross-country navigation, GPS-style." />
    <title>Vautour</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <div id="phone">
        <div id="statusbar" aria-hidden="true">
          <span id="clock">11:00</span>
          <svg width="70" height="14" viewBox="0 0 70 14" aria-hidden="true">
            <g fill="#fff">
              <rect x="0" y="9" width="3" height="5" rx="1" />
              <rect x="5" y="6" width="3" height="8" rx="1" />
              <rect x="10" y="3" width="3" height="11" rx="1" />
              <rect x="15" y="0" width="3" height="14" rx="1" />
              <rect x="40" y="2" width="24" height="11" rx="3" fill="none" stroke="#fff" stroke-width="1.5" />
              <rect x="42.5" y="4.5" width="15" height="6" rx="1.5" />
              <rect x="65" y="5.5" width="2" height="4" rx="1" />
            </g>
          </svg>
        </div>
        <canvas id="map"></canvas>
        <div id="pins"></div>
        <div id="glider">
          <svg id="arrow" viewBox="0 0 48 48" aria-hidden="true">
            <path d="M24 3 L42 42 L24 33 L6 42 Z" fill="#2b8cff" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" />
          </svg>
          <div id="altchip"></div>
        </div>
        <div id="next" hidden></div>
        <div id="banner" class="hide" aria-live="polite">
          <div id="bicon"></div>
          <div id="bmain"></div>
          <div id="bsub"></div>
          <div id="bmeta"></div>
          <div id="bprog"><div id="bprog-bar"></div></div>
        </div>
        <div id="alert" role="status"></div>
        <div id="side">
          <button type="button" class="round" id="compass">
            <svg viewBox="0 0 26 26" aria-hidden="true">
              <g id="needle"><path d="M13 3 L17 13 H9Z" fill="#ff4d5e" /><path d="M13 23 L9 13 H17Z" fill="#b5bec9" /></g>
            </svg>
          </button>
          <div id="wind">
            <svg viewBox="0 0 22 22" aria-hidden="true">
              <g id="windarrow">
                <path d="M11 19 V5 M6 9 L11 3 L16 9" fill="none" stroke="#2b8cff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
              </g>
            </svg>
            <span id="windtxt"></span>
          </div>
        </div>
        <div id="simbox">
          <button type="button" id="play"></button>
          <button type="button" id="speed"></button>
        </div>
        <button type="button" id="recenter">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2 L15 16 L9 12 L3 16Z" fill="#2b8cff" /></svg>
          <span></span>
        </button>
        <div id="vario"><div><b id="vval">+0,0</b><span id="vunit">m/s</span></div></div>
        <div id="gs"></div>
        <button type="button" id="report"></button>
        <div id="bar">
          <button type="button" class="round" id="overview"></button>
          <button type="button" id="eta"><b id="etat">—</b><span id="etas">—</span></button>
          <button type="button" class="round" id="sound"></button>
          <button type="button" class="round" id="routes"></button>
        </div>
        <div id="scrim"></div>
        <div id="sheet" role="dialog" aria-modal="true"></div>
        <div id="toast" role="status"></div>
        <div id="loading">…</div>
      </div>
      <p id="caption"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
